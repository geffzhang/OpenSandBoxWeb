configs:
  opensandbox-config:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8090

      [proxy]
      # The lifecycle server is attached to opensandbox-net, while sandboxes
      # created through the mounted Docker socket use Docker's bridge network.
      # Route through host-published ports instead of unreachable sandbox IPs.
      resolve_internal = false

      [log]
      level = "INFO"

      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.1.0"
      # execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:v1.1.0"

      [egress]
      image = "opensandbox/egress:v1.1.7"
      # image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/egress:v1.1.7"
      readiness_timeout_seconds = 30.0

      [docker]
      network_mode = "bridge"
      # Required when the server runs in a container: host-mapped endpoints and
      # proxy targets must resolve back to the Docker host.
      host_ip = "host.docker.internal"
      port_range_min = 40000
      port_range_max = 60000
      drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
      no_new_privileges = true
      pids_limit = 4096

      [ingress]
      mode = "direct"

services:
  postgres:
    image: postgres:17
    networks:
      - opensandbox-net
    environment:
      POSTGRES_DB: opensandbox
      POSTGRES_USER: opensandbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensandbox}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensandbox -d opensandbox"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  opensandbox-server:
    # Includes configurable proxy resolution for this Compose/bridge topology.
    image: opensandbox/server:release-1.1.0
    networks:
      - opensandbox-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    configs:
      - source: opensandbox-config
        target: /etc/opensandbox/config.toml
    environment:
      - SANDBOX_CONFIG_PATH=/etc/opensandbox/config.toml
      - OPENSANDBOX_INSECURE_SERVER=YES

  opensandbox-web:
    build: .
    ports:
      - "5080:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OpenSandbox__Domain: ${OPENSANDBOX_DOMAIN:-http://opensandbox-server:8090}
      OpenSandbox__ApiKey: ${OPENSANDBOX_API_KEY:-}
      OpenSandbox__RequestTimeoutSeconds: ${OPENSANDBOX_REQUEST_TIMEOUT_SECONDS:-30}
      Auth__Authority: ${AUTH_AUTHORITY:-http://localhost:8081/realms/opensandbox}
      Auth__MetadataAddress: ${AUTH_METADATA_ADDRESS:-http://keycloak:8080/realms/opensandbox/.well-known/openid-configuration}
      Auth__ClientId: ${AUTH_CLIENT_ID:-opensandbox-web}
      Auth__RequireHttpsMetadata: ${AUTH_REQUIRE_HTTPS_METADATA:-false}
      # POSTGRES_PASSWORD is interpolated directly into this Npgsql connection
      # string: it must be URL/alphanumeric-safe (A-Z a-z 0-9 - _ . ~) with no
      # ';', quotes or whitespace. A ';' splits the connection string and can
      # crash-loop the web container during startup migration.
      ConnectionStrings__VolumeManager: "Host=postgres;Port=5432;Database=opensandbox;Username=opensandbox;Password=${POSTGRES_PASSWORD:-opensandbox}"
      VolumeManager__Enabled: ${VOLUME_MANAGER_ENABLED:-true}
    depends_on:
      opensandbox-server:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - opensandbox-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  keycloak-postgres:
    image: postgres:16-alpine
    networks:
      - opensandbox-net
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - opensandbox-keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start --import-realm --health-enabled=true
    networks:
      - opensandbox-net
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak/opensandbox-realm.json:/opt/keycloak/data/import/opensandbox-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&3 && grep -q '\"status\"[[:space:]]*:[[:space:]]*\"UP\"' <&3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  opensandbox-net:
    driver: bridge

volumes:
  opensandbox-keycloak-postgres:
  postgres-data:
